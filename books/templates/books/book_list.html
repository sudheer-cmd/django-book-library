<!doctype html>
<html>
  <head>
    <title>My Book Library</title>
  </head>
  <body>
    <h1>My Book Library</h1>

    <p>Total books: {{ books|length }}</p>

    <table border="1" cellpadding="8">
      <tr>
        <th>No.</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Status</th>
      </tr>

      {% for book in books %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.year_published }}</td>
        <td>
          {% if book.is_available %} Available {% else %} Issued {% endif %}
        </td>
      </tr>
      {% endfor %}
    </table>

    <br />

    <a href="/add/">Add Book</a>
  </body>
</html>
